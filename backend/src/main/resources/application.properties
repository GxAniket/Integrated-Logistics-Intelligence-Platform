
spring.application.name=backend

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shiptrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# OpenStreetMap / Nominatim / OSRM
shiptrack.maps.geocoding-url=https://nominatim.openstreetmap.org/search
shiptrack.maps.routing-url=https://router.project-osrm.org/route/v1/driving
shiptrack.maps.user-agent=ShipTrack/1.0
shiptrack.maps.connect-timeout=5s
shiptrack.maps.read-timeout=15s