spring.application.name=backend

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiptrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=gifty
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8082

# Password reset email (configure these environment variables to enable delivery).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}

# OpenStreetMap / Nominatim / OSRM
shiptrack.maps.geocoding-url=https://nominatim.openstreetmap.org/search
shiptrack.maps.routing-url=https://router.project-osrm.org/route/v1/driving
shiptrack.maps.user-agent=ShipTrack/1.0
shiptrack.maps.connect-timeout=5s
shiptrack.maps.read-timeout=15s

# One-time initial administrator provisioning (disabled unless explicitly enabled).
shiptrack.bootstrap-admin.enabled=${SHIPTRACK_BOOTSTRAP_ADMIN_ENABLED:false}
shiptrack.bootstrap-admin.email=${SHIPTRACK_BOOTSTRAP_ADMIN_EMAIL:}
shiptrack.bootstrap-admin.password=${SHIPTRACK_BOOTSTRAP_ADMIN_PASSWORD:}
shiptrack.bootstrap-admin.full-name=${SHIPTRACK_BOOTSTRAP_ADMIN_FULL_NAME:}